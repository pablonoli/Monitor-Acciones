name: Indicadores técnicos
on:
  schedule:
    - cron: "30 21 * * 1-5"   # después del cierre de EE.UU. (18:30 hora de Argentina)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  tecnico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy
      - run: python scripts/tecnico.py
      - name: Guardar resultado
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add data/tecnico.json
          git commit -m "Técnico $(date -u +%F)" || echo "sin cambios"
          git pull --rebase origin main || true
          git push
