name: Actualizar datos
on:
  schedule:
    - cron: "35 10 * * 1-5"   # 7:35 hora de Argentina, lunes a viernes
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Cuántas empresas procesar (vacío = todas)"
        required: false
      tickers:
        description: "Solo estos tickers, separados por espacio (vacío = todos)"
        required: false
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance
      - run: python scripts/fetch.py ${{ github.event.inputs.cantidad }}
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
      - name: Guardar resultado
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add -A data
          git commit -m "Datos $(date -u +%F)" || echo "sin cambios"
          git pull --rebase origin main || true
          git push
