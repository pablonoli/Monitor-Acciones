name: Investigación cripto, cruce 10/30 contra círculo verde
on:
  workflow_dispatch:
  push:
    branches: [investigacion-cripto-circulos]
    paths:
      - "scripts/investigacion_cripto_circulos.py"
      - ".github/workflows/investigacion_cripto_circulos.yml"
permissions:
  contents: write
concurrency:
  group: investigacion-cripto-circulos
  cancel-in-progress: false
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy
      - run: python scripts/investigacion_cripto_circulos.py
      - name: Guardar resultado (solo en esta rama, nunca en main)
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add data/investigacion_cripto_circulos.txt
          git commit -m "Investigación cripto círculos $(date -u +%F)" || echo "sin cambios"
          git push origin HEAD:${GITHUB_REF_NAME}
