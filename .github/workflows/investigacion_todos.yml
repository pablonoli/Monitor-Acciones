name: Investigación círculos verdes, con todos los CEDEARs
on:
  workflow_dispatch:
  push:
    branches: [investigacion-todos-cedears]
    paths:
      - "scripts/investigacion_todos.py"
      - ".github/workflows/investigacion_todos.yml"
permissions:
  contents: write
concurrency:
  group: investigacion-todos
  cancel-in-progress: false
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy
      - run: python scripts/investigacion_todos.py 5
      - name: Guardar resultado (solo en esta rama, nunca en main)
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add data/investigacion_todos.txt
          git commit -m "Investigación círculos: con todos los CEDEARs $(date -u +%F)" || echo "sin cambios"
          git push origin HEAD:${GITHUB_REF_NAME}
