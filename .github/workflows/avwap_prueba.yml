name: Prueba AVWAP
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: avwap
  cancel-in-progress: false
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy
      - run: python scripts/avwap_prueba.py
      - name: Guardar resultado
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add data/avwap_prueba.json data/avwap_prueba.md
          git commit -m "Prueba AVWAP $(date -u +%F)" || echo "sin cambios"
          git pull --rebase origin main || true
          git push
