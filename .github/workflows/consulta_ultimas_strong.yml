name: Consulta últimas señales Strong
on:
  workflow_dispatch:
  push:
    branches: [consulta-ultimas-strong]
    paths:
      - "scripts/consulta_ultimas_strong.py"
      - ".github/workflows/consulta_ultimas_strong.yml"
permissions:
  contents: write
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy requests
      - run: python scripts/consulta_ultimas_strong.py
      - name: Guardar resultado (solo en esta rama, nunca en main)
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add data/consulta_ultimas_strong.txt data/consulta_strong_ene_ago.txt data/consulta_strong_detalle.txt
          git commit -m "Consulta últimas Strong $(date -u +%F)" || echo "sin cambios"
          git push origin HEAD:${GITHUB_REF_NAME}
